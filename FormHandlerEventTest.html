<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Campaign Registration</title>
  <style>
    form {
      max-width: 400px;
      font-family: Arial, sans-serif;
    }
    label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
    }
    input, textarea {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
      box-sizing: border-box;
    }
    button {
      margin-top: 16px;
      padding: 10px;
      width: 100%;
      cursor: pointer;
    }
  </style>
</head>
<body>

<form
  id="MC45OBUN4HLRFMTLVMPBYF7VNYHQ"
  data-uma-forms="true"
  method="post"
  action="#"
>
  <label for="firstname">First name</label>
  <input type="text" id="firstname" name="firstname" required>

  <label for="lastname">Last name</label>
  <input type="text" id="lastname" name="lastname" required>

  <label for="email">Email</label>
  <input type="email" id="email" name="email" required>

  <label for="description">Description</label>
  <textarea id="description" name="description"></textarea>

  <button type="submit">Submit</button>
</form>

<!-- Insert these code snippets into your external site page -->
<script
  async
  src="https://connect.procom-me.com/assets/scripts/external-form-handler-host.min.js"
  onload="SFDCFormHandler.init('https://connect.procom-me.com')">
</script>

</body>
</html>
