<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MC Next Form Test</title>
</head>
<body>
v2
<form
  id="MC45OBUN4HLRFMTLVMPBYF7VNYHQ"
  data-uma-forms="true"
  method="post"
  action="#"
>
  <label>First Name</label>
  <input type="text" name="FirstName" required>

  <label>Last Name</label>
  <input type="text" name="LastName" required>

  <label>Email</label>
  <input type="email" name="Email" required>

  <label>Description</label>
  <textarea name="Description"></textarea>

  <button type="submit">Submit</button>
</form>

<div id="thankyou" style="display:none;">Thank you! Submission received.</div>

<script async src="https://connect.procom-me.com/assets/scripts/external-form-handler-host.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  SFDCFormHandler.init('https://connect.procom-me.com');

  const form = document.getElementById('MC45OBUN4HLRFMTLVMPBYF7VNYHQ');
  form.addEventListener('submit', () => {
    document.getElementById('thankyou').style.display = 'block';
    form.reset();
  });
});
</script>

</body>
</html>
