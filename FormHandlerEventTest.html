<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MC Next Form Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 50px auto;
    }
    label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
    }
    input, textarea {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
      box-sizing: border-box;
    }
    button {
      margin-top: 16px;
      padding: 10px;
      width: 100%;
      cursor: pointer;
    }
    #thankyou {
      display: none;
      margin-top: 20px;
      padding: 15px;
      background-color: #dff0d8;
      color: #3c763d;
      border-radius: 5px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<h2>MC Next / Data Cloud Form</h2>

<form
  id="MC45OBUN4HLRFMTLVMPBYF7VNYHQ"
  data-uma-forms="true"
  method="post"
  action="#"
>
  <label for="FirstName">First Name</label>
  <input type="text" id="FirstName" name="FirstName" required>

  <label for="LastName">Last Name</label>
  <input type="text" id="LastName" name="LastName" required>

  <label for="Email">Email</label>
  <input type="email" id="Email" name="Email" required>

  <label for="Description">Description</label>
  <textarea id="Description" name="Description" rows="4"></textarea>

  <button type="submit">Submit</button>
</form>

<div id="thankyou">Thank you! Your submission has been received.</div>

<!-- External form handler script -->
<script async src="https://connect.procom-me.com/assets/scripts/external-form-handler-host.min.js"
        onload="SFDCFormHandler.init('https://connect.procom-me.com')"></script>

<script>
  // Show thank you message after submission
  const form = document.getElementById('MC45OBUN4HLRFMTLVMPBYF7VNYHQ');
  form.addEventListener('submit', () => {
    // Show thank you immediately; Data Cloud submission happens in background
    document.getElementById('thankyou').style.display = 'block';
    // Optional: clear form
    form.reset();
  });
</script>

</body>
</html>
